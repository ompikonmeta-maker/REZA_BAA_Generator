<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Picker Lokasi (searchable)</title>
<style>
  :root{--bg:#e9ecec;--pane:#fcfefe;--ink:#141a19;--mut:#586261;--ov:#d6dbda;--fill:#eef2f1;
    --pri:#04726f;--sec:#cfe6e5;--onsec:#00413f;--warn:#9a5b00;--warnbg:#fdeede;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101413;--pane:#171b1b;--ink:#e6e9e8;--mut:#9fa8a7;--ov:#2d3433;--fill:#1e2322;--pri:#57d6d1;--sec:#0e3b39;--onsec:#9ff0ec;--warn:#ffb95c;--warnbg:#3a2a10;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,system-ui,sans-serif;min-height:100vh}
  .top{display:flex;justify-content:flex-end;padding:20px 26px;position:relative}
  .note{max-width:640px;margin:8px auto 0;color:var(--mut);font-size:12.5px;text-align:center;padding:0 20px}
  /* trigger */
  .trg{display:inline-flex;align-items:center;gap:10px;background:var(--pane);border:1px solid var(--ov);border-radius:14px;padding:9px 12px;cursor:pointer;min-width:230px}
  .trg .lab{font-size:10.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .trg .val{font-weight:600;font-size:13.5px}.trg .code{font-family:ui-monospace,Consolas,monospace;color:var(--pri)}
  .trg .mi{margin-left:auto;color:var(--mut);transition:transform .2s}
  .trg.open .mi{transform:rotate(180deg)}
  /* panel */
  .panel{position:absolute;top:64px;right:26px;width:340px;max-width:calc(100vw - 40px);background:var(--pane);
    border:1px solid var(--ov);border-radius:18px;box-shadow:0 18px 48px rgba(0,0,0,.22);overflow:hidden;
    display:none;flex-direction:column;z-index:50;transform-origin:top;animation:pop .18s cubic-bezier(.2,0,0,1)}
  .panel.show{display:flex}
  @keyframes pop{from{opacity:0;transform:translateY(-6px) scaleY(.96)}}
  .search{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--ov)}
  .search .mi{color:var(--mut)}
  .search input{flex:1;border:none;background:transparent;outline:none;font-size:14px;color:var(--ink)}
  .list{max-height:300px;overflow-y:auto;padding:6px;scrollbar-gutter:stable}
  .opt{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;cursor:pointer}
  .opt:hover,.opt.act{background:var(--fill)}
  .opt .code{font-family:ui-monospace,Consolas,monospace;color:var(--pri);font-weight:700;font-size:12.5px;min-width:96px}
  .opt .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt.sel .code::before{content:"check";font-family:"Material Symbols Outlined";margin-right:4px}
  .badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px}
  .b-d{background:var(--warnbg);color:var(--warn)}.b-s{background:var(--sec);color:var(--onsec)}
  .empty{padding:26px 14px;text-align:center;color:var(--mut);font-size:13px}
  .foot{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--ov)}
  .foot .cnt{color:var(--mut);font-size:11.5px}
  .foot .new{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--pri);color:#fff;border:none;border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer;font-size:12.5px}
  .mi{font-family:"Material Symbols Outlined","Segoe UI Symbol";font-style:normal;line-height:1}
</style>
</head>
<body>
  <div class="top">
    <div class="trg" id="trg">
      <div><div class="lab">Lokasi</div><div class="val" id="trgVal"><span class="code">LOK-7F3K9Q</span> · Kopdes Sukamaju</div></div>
      <span class="mi">expand_more</span>
    </div>
    <div class="panel" id="panel">
      <div class="search"><span class="mi">search</span><input id="q" placeholder="Cari kode / nama lokasi…" autocomplete="off"></div>
      <div class="list" id="list"></div>
      <div class="foot"><span class="cnt" id="cnt"></span><button class="new"><span class="mi">add</span>Buat lokasi baru</button></div>
    </div>
  </div>
  <p class="note">Panel pencarian: ketik untuk memfilter, daftar bisa di-scroll sendiri tanpa menutup, klik scrollbar aman. Esc / klik di luar untuk menutup. Cocok untuk ribuan lokasi.</p>

<script>
  const $=s=>document.querySelector(s);
  const NAMES=['Kopdes Sukamaju','Kopdes Merah Putih','Kopdes Maju Jaya','Kopdes Sinar Tani','Kopdes Bahari','Kopdes Sejahtera','Kopdes Tunas Muda','Kopdes Karya','Kopdes Rukun','Kopdes Sentosa','Kopdes Harapan','Kopdes Mekar','Kopdes Bersama','Kopdes Lestari','Kopdes Amanah'];
  const CODE=()=>'LOK-'+Array.from({length:6},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*31)]).join('');
  const DATA=Array.from({length:42},(_,i)=>({code:CODE(),nama:NAMES[i%NAMES.length]+' '+(i+1),status:Math.random()>.4?'selesai':'draft'}));
  let sel=0,act=0,open=false;
  function render(){
    const q=$('#q').value.toLowerCase();
    const rows=DATA.filter(d=>d.code.toLowerCase().includes(q)||d.nama.toLowerCase().includes(q));
    $('#cnt').textContent=rows.length+' / '+DATA.length+' lokasi';
    $('#list').innerHTML=rows.length?rows.map((d,i)=>`<div class="opt ${i===act?'act':''} ${DATA[sel]&&d.code===DATA[sel].code?'sel':''}" data-code="${d.code}">
      <span class="code">${d.code}</span><span class="nm">${d.nama}</span>
      <span class="badge ${d.status==='selesai'?'b-s':'b-d'}">${d.status}</span></div>`).join(''):'<div class="empty">Tidak ada lokasi cocok.<br>Coba kata kunci lain atau buat baru.</div>';
    [...$('#list').children].forEach(el=>el.dataset&&el.dataset.code&&el.addEventListener('click',()=>choose(el.dataset.code)));
  }
  function choose(code){const d=DATA.find(x=>x.code===code);sel=DATA.indexOf(d);
    $('#trgVal').innerHTML=`<span class="code">${d.code}</span> · ${d.nama}`;close();}
  function openPanel(){open=true;$('#panel').classList.add('show');$('#trg').classList.add('open');$('#q').value='';act=0;render();setTimeout(()=>$('#q').focus(),30);}
  function close(){open=false;$('#panel').classList.remove('show');$('#trg').classList.remove('open');}
  $('#trg').addEventListener('click',()=>open?close():openPanel());
  $('#q').addEventListener('input',()=>{act=0;render();});
  $('#q').addEventListener('keydown',e=>{const opts=[...$('#list').querySelectorAll('.opt')];
    if(e.key==='ArrowDown'){act=Math.min(act+1,opts.length-1);render();opts[act]&&$('#list').children[act].scrollIntoView({block:'nearest'});e.preventDefault();}
    else if(e.key==='ArrowUp'){act=Math.max(act-1,0);render();e.preventDefault();}
    else if(e.key==='Enter'){opts[act]&&choose(opts[act].dataset.code);}
    else if(e.key==='Escape')close();});
  document.addEventListener('click',e=>{if(open&&!e.target.closest('#panel')&&!e.target.closest('#trg'))close();});
</script>
</body>
</html>
