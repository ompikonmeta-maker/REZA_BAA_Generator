<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Animasi klik tombol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eef1f1;--pane:#fcfefe;--ink:#141a19;--mut:#586261;--ov:#d6dbda;--pri:#04726f;--sec:#cfe6e5;--onsec:#00413f;--cyan:#7de7e6;--disp:'Sora',system-ui;
    --sfast:350ms cubic-bezier(0.42,1.67,0.21,0.90)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101413;--pane:#171b1b;--ink:#e6e9e8;--mut:#9fa8a7;--ov:#2d3433;--pri:#57d6d1;--sec:#0e3b39;--onsec:#9ff0ec;--cyan:#123634}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,system-ui}
  .mi{font-family:"Material Symbols Outlined";font-style:normal;vertical-align:-3px}
  .wrap{max-width:760px;margin:0 auto;padding:34px 20px 60px}
  h1{font-family:var(--disp);font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 22px}
  .picker{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .opt{border:1px solid var(--ov);background:var(--pane);border-radius:20px;padding:9px 14px;font-weight:700;color:var(--mut);cursor:pointer;font-size:13px}
  .opt.on{background:var(--sec);color:var(--onsec);border-color:transparent}
  .stage{background:var(--pane);border:1px solid var(--ov);border-radius:18px;padding:26px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .desc{color:var(--mut);font-size:13px;margin:16px 2px 0;min-height:40px}.desc b{color:var(--ink)}
  /* tombol dasar (meniru md-button) */
  .btn{position:relative;overflow:hidden;border:0;border-radius:999px;padding:11px 20px;font-weight:800;font-size:14px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;transition:border-radius var(--sfast),box-shadow .2s ease,transform .12s ease,filter .2s ease;
    -webkit-tap-highlight-color:transparent;user-select:none}
  .btn .mi{font-size:19px}
  .tonal{background:var(--cyan);color:#00514e}
  .filled{background:var(--pri);color:#fff;box-shadow:0 3px 10px color-mix(in srgb,var(--pri) 30%,transparent)}
  .text{background:transparent;color:var(--pri)}
  .outlined{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 1px var(--ov)}
  /* ===== A. shape morph (SEKARANG) ===== */
  .a .btn:active{border-radius:12px}
  /* ===== B. scale press ===== */
  .b .btn{transition:transform .13s cubic-bezier(.2,.8,.2,1),box-shadow .2s,filter .2s}
  .b .btn:active{transform:scale(.94)}
  /* ===== C. press-in (turun + bayangan mengecil) ===== */
  .c .btn{transition:transform .12s ease,box-shadow .18s ease,filter .18s}
  .c .btn:active{transform:translateY(2px);filter:brightness(.96)}
  .c .btn.filled:active{box-shadow:0 1px 4px color-mix(in srgb,var(--pri) 26%,transparent)}
  /* ===== D. ripple ===== */
  .d .btn{transition:transform .12s ease}
  .d .btn:active{transform:scale(.98)}
  .rip{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:currentColor;opacity:.28;pointer-events:none;animation:rip .5s ease-out forwards}
  @keyframes rip{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
  /* ===== E. pop spring (naik sedikit lalu memantul) ===== */
  .e .btn{transition:transform .16s cubic-bezier(.34,1.4,.5,1),box-shadow .2s}
  .e .btn:active{transform:scale(.9)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Animasi klik tombol</h1>
  <p class="sub">Pilih gaya, lalu <b>klik-tahan</b> tombol di bawah untuk merasakannya.</p>
  <div class="picker" id="picker">
    <button class="opt" data-o="a">A · Shape morph (sekarang)</button>
    <button class="opt on" data-o="b">B · Scale press</button>
    <button class="opt" data-o="c">C · Press-in</button>
    <button class="opt" data-o="d">D · Ripple</button>
    <button class="opt" data-o="e">E · Pop spring</button>
  </div>
  <div class="stage b" id="stage">
    <button class="btn tonal"><span class="mi">help</span> Cara baca</button>
    <button class="btn filled"><span class="mi">save</span> Simpan</button>
    <button class="btn outlined"><span class="mi">add</span> Field</button>
    <button class="btn text">Batal</button>
  </div>
  <p class="desc" id="desc"></p>
</div>
<script>
  const stage=document.getElementById('stage');
  const DESC={
    a:'<b>A · Shape morph (sekarang).</b> Sudut berubah pill→kotak saat ditekan, dengan pantul. Ini yang kamu kurang suka.',
    b:'<b>B · Scale press.</b> Tombol mengecil halus (94%) saat ditekan, balik saat dilepas. Modern, simpel, terasa tactile. <b>Rekomendasi.</b>',
    c:'<b>C · Press-in.</b> Tombol turun 2px + bayangan/brightness mengecil — terasa seperti benar-benar ditekan (depth).',
    d:'<b>D · Ripple.</b> Riak menyebar dari titik klik (khas Material) + sedikit scale. Menarik, sedikit lebih ramai.',
    e:'<b>E · Pop spring.</b> Menekan lebih dalam (90%) lalu memantul balik — playful tapi masih rapi.'
  };
  function set(o){stage.className='stage '+o;
    document.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x.dataset.o===o));
    document.getElementById('desc').innerHTML=DESC[o];}
  document.querySelectorAll('.opt').forEach(o=>o.addEventListener('click',()=>set(o.dataset.o)));
  // ripple hanya untuk opsi D
  stage.addEventListener('pointerdown',e=>{if(!stage.classList.contains('d'))return;const b=e.target.closest('.btn');if(!b)return;
    const r=b.getBoundingClientRect();const s=Math.max(r.width,r.height)*2.2;const el=document.createElement('span');el.className='rip';
    el.style.width=el.style.height=s+'px';el.style.left=(e.clientX-r.left)+'px';el.style.top=(e.clientY-r.top)+'px';
    b.appendChild(el);setTimeout(()=>el.remove(),520);});
  set('b');
</script>
</body>
</html>
