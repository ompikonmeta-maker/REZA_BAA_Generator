<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto B — Corner Actions</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eaeced;--pane:#fcfcfd;--ink:#1a1c1d;--mut:#5a6462;--ov:#c7cccb;--pri:#04726f;--sec:#cfe6e5;--onsec:#00413f;--bad:#a3312a}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,system-ui;display:grid;place-items:center;min-height:100vh}
  .mi{font-family:"Material Symbols Outlined";font-style:normal;line-height:1;vertical-align:-3px}
  .wrap{width:320px}.cap{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
  .pcard{background:var(--pane);border:1px solid var(--ov);border-radius:18px;padding:12px;position:relative;overflow:hidden}
  .hd{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:8px}.hd .mi{color:var(--pri)}
  .snap{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#2a3b3a}
  .snap img{width:100%;height:100%;object-fit:cover;display:block}
  .chips{position:absolute;top:8px;right:8px;display:flex;gap:6px}
  .chips button{border:none;background:rgba(255,255,255,.92);color:#1a1c1d;width:34px;height:34px;border-radius:10px;cursor:pointer;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  .chips button.del{color:var(--bad)}
  /* linear undo bar in-card bottom */
  .undo{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(20,26,25,.92);color:#fff;border-radius:12px;padding:10px 12px;display:none;align-items:center;gap:10px}
  .undo.on{display:flex;animation:sl .25s cubic-bezier(.2,.8,.2,1)}
  @keyframes sl{from{transform:translateY(12px);opacity:0}}
  .undo .msg{flex:1;font-size:12.5px}
  .undo .u{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:16px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:12px}
  .prog{position:absolute;left:0;bottom:0;height:3px;background:#4fd8d8;width:100%;border-radius:0 0 12px 12px}
  /* bottom-sheet editor */
  .ed{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:5}
  .ed.on{display:flex;animation:fade .2s}@keyframes fade{from{opacity:0}}
  .sheet{background:var(--pane);border-radius:22px 22px 0 0;width:420px;max-width:100vw;padding:18px;animation:up .3s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(100%)}}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--ov);margin:0 auto 12px}
  .stage{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#0e1413;touch-action:none;cursor:grab}
  .stage img{position:absolute;left:50%;top:50%;width:130%;transform:translate(-50%,-50%);user-select:none;pointer-events:none}
  .grid{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5);background:linear-gradient(rgba(255,255,255,.3) 1px,transparent 1px) 0 33%/100% 33%,linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px) 33% 0/33% 100%}
  .row{display:flex;align-items:center;gap:10px;margin:12px 0 4px}.row input[type=range]{flex:1;accent-color:var(--pri)}
  .asp{display:inline-flex;background:var(--bg);border-radius:10px;padding:3px}.asp button{border:none;background:transparent;color:var(--mut);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:12.5px}.asp button.on{background:var(--pane);color:var(--pri);box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .act{display:flex;gap:8px;margin-top:14px}.act .grow{flex:1}
  .b{border:none;border-radius:20px;padding:11px 16px;font-weight:700;cursor:pointer;display:flex;gap:7px;align-items:center;font-size:13px}
  .filled{background:var(--pri);color:#fff}.tonal{background:var(--sec);color:var(--onsec)}.ghost{background:transparent;color:var(--mut)}.delb{background:transparent;color:var(--bad)}
</style></head>
<body>
<div class="wrap">
  <div class="pcard">
    <div class="hd"><span class="mi">image</span> Capture Dashboard (STARMON)</div>
    <div class="snap">
      <img src="data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='600'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230e8b86'/%3E%3Cstop offset='1' stop-color='%230a3b39'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='600' height='600' fill='url(%23g)'/%3E%3Cg stroke='%23fff' stroke-opacity='0.25'%3E%3Cpath d='M0 150H600M0 300H600M0 450H600M150 0V600M300 0V600M450 0V600'/%3E%3C/g%3E%3Ccircle cx='300' cy='300' r='120' fill='%23fff' fill-opacity='0.15'/%3E%3Ctext x='300' y='316' font-family='sans-serif' font-size='44' fill='%23fff' text-anchor='middle'%3EFOTO%3C/text%3E%3C/svg%3E">
      <div class="chips">
        <button title="Edit" onclick="openEd()"><span class="mi">crop_rotate</span></button>
        <button title="Ganti"><span class="mi">swap_horiz</span></button>
        <button class="del" title="Hapus" onclick="del()"><span class="mi">delete</span></button>
      </div>
      <div class="undo" id="undo"><span class="msg">Foto dihapus · <b id="cd">5</b>s</span><button class="u" onclick="undo()">Urungkan</button><span class="prog" id="prog"></span></div>
    </div>
  </div>
  <div class="cap"><b>Opsi B — Corner Actions + Bottom-sheet.</b> Aksi selalu tampak di pojok. Editor naik dari bawah. Hapus → bar undo + progress timer di dalam kartu.</div>
</div>
<div class="ed" id="ed"><div class="sheet">
  <div class="grab"></div>
  <div class="stage" id="stage"><img src="data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='600'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230e8b86'/%3E%3Cstop offset='1' stop-color='%230a3b39'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='600' height='600' fill='url(%23g)'/%3E%3Cg stroke='%23fff' stroke-opacity='0.25'%3E%3Cpath d='M0 150H600M0 300H600M0 450H600M150 0V600M300 0V600M450 0V600'/%3E%3C/g%3E%3Ccircle cx='300' cy='300' r='120' fill='%23fff' fill-opacity='0.15'/%3E%3Ctext x='300' y='316' font-family='sans-serif' font-size='44' fill='%23fff' text-anchor='middle'%3EFOTO%3C/text%3E%3C/svg%3E" id="edImg"><div class="grid"></div></div>
  <div class="row"><span class="asp"><button class="on">4:3</button><button>1:1</button><button>Bebas</button></span></div>
  <div class="row"><span class="mi">zoom_out</span><input type="range" min="100" max="260" value="130" id="z"><span class="mi">zoom_in</span></div>
  <div class="act"><button class="b delb"><span class="mi">delete</span>Hapus</button><span class="grow"></span><button class="b ghost" onclick="closeEd()">Batal</button><button class="b filled"><span class="mi">check</span>Simpan</button></div>
</div></div>
<script>
  const $=s=>document.querySelector(s);
  const st=$('#stage'),im=$('#edImg');let z=1.3,dx=0,dy=0,drag=false,px,py;
  function apply(){im.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${z})`;}
  $('#z').addEventListener('input',e=>{z=e.target.value/100;apply();});
  st.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;st.setPointerCapture(e.pointerId);st.style.cursor='grabbing'});
  st.addEventListener('pointermove',e=>{if(!drag)return;dx+=e.clientX-px;dy+=e.clientY-py;px=e.clientX;py=e.clientY;apply()});
  st.addEventListener('pointerup',()=>{drag=false;st.style.cursor='grab'});
  document.querySelectorAll('.asp button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.asp button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  window.openEd=()=>{$('#ed').classList.add('on');apply()};window.closeEd=()=>$('#ed').classList.remove('on');
  let t,left;
  window.del=()=>{$('#undo').classList.add('on');left=5;$('#cd').textContent=left;const p=$('#prog');p.style.transition='none';p.style.width='100%';requestAnimationFrame(()=>{p.style.transition='width 5s linear';p.style.width='0%'});
    clearInterval(t);t=setInterval(()=>{left--;$('#cd').textContent=left;if(left<=0){clearInterval(t);$('#undo').classList.remove('on')}},1000)};
  window.undo=()=>{clearInterval(t);$('#undo').classList.remove('on')};
</script></body></html>
