<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto C — Immersive Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">
<style>
  :root{--bg:#eaeced;--pane:#fcfcfd;--ink:#1a1c1d;--mut:#5a6462;--ov:#c7cccb;--pri:#04726f;--sec:#cfe6e5;--onsec:#00413f;--bad:#a3312a}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Segoe UI",Roboto,system-ui;display:grid;place-items:center;min-height:100vh}
  .mi{font-family:"Material Symbols Outlined";font-style:normal;line-height:1;vertical-align:-3px}
  .wrap{width:320px}.cap{font-size:12px;color:var(--mut);text-align:center;margin-top:14px}
  .pcard{background:var(--pane);border:1px solid var(--ov);border-radius:18px;padding:12px;position:relative;overflow:hidden}
  .hd{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;margin-bottom:8px}.hd .mi{color:var(--pri)}
  .snap{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#2a3b3a;cursor:zoom-in}
  .snap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
  .snap:hover img{transform:scale(1.03)}
  .snap .tap{position:absolute;inset:0;display:grid;place-items:center;color:#fff;opacity:0;transition:.2s;background:rgba(0,0,0,.25)}
  .snap:hover .tap{opacity:1}.snap .tap .mi{font-size:30px}
  /* in-card undo: center pill + circular timer */
  .undo{position:absolute;inset:0;background:rgba(20,26,25,.8);color:#fff;display:none;align-items:center;justify-content:center;gap:12px;backdrop-filter:blur(2px)}
  .undo.on{display:flex;animation:fade .25s}@keyframes fade{from{opacity:0}}
  .pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:24px;padding:8px 8px 8px 14px}
  .pill .u{border:none;background:#fff;color:#1a1c1d;border-radius:18px;padding:7px 14px;font-weight:700;cursor:pointer;display:flex;gap:6px;align-items:center}
  .ring{width:34px;height:34px;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:4}.ring .t{stroke:rgba(255,255,255,.25)}.ring .p{stroke:#fff;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
  .cd{position:absolute;font-size:11px;font-weight:700}
  /* immersive editor */
  .ed{position:fixed;inset:0;background:#0b1211;display:none;flex-direction:column;z-index:5;color:#eafaf9}
  .ed.on{display:flex;animation:fade .25s}
  .edtop{display:flex;align-items:center;gap:10px;padding:16px}.edtop .ttl{font-weight:700}.edtop .grow{flex:1}
  .edtop .ic{color:#cfe6e5;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
  .edtop .ic:hover{background:rgba(255,255,255,.1)}
  .estage{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;display:grid;place-items:center}
  .estage img{position:absolute;left:50%;top:50%;height:78%;transform:translate(-50%,-50%);user-select:none;pointer-events:none}
  .frame{position:relative;width:min(72vmin,72vw);aspect-ratio:1;box-shadow:0 0 0 9999px rgba(0,0,0,.5);border-radius:8px;outline:2px solid rgba(255,255,255,.9);pointer-events:none;z-index:2}
  .frame::before,.frame::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.3) 1px,transparent 1px) 0 33%/100% 33%,linear-gradient(90deg,rgba(255,255,255,.3) 1px,transparent 1px) 33% 0/33% 100%}
  .ebot{padding:16px 20px 22px;display:flex;flex-direction:column;gap:12px}
  .asp{display:flex;gap:8px;justify-content:center}.asp button{border:1px solid rgba(255,255,255,.25);background:transparent;color:#cfe6e5;border-radius:20px;padding:7px 14px;cursor:pointer;font-weight:600;font-size:12.5px}.asp button.on{background:#04726f;border-color:#04726f;color:#fff}
  .zrow{display:flex;align-items:center;gap:12px;max-width:520px;width:100%;margin:0 auto}.zrow input{flex:1;accent-color:#4fd8d8}
  .eact{display:flex;gap:8px;justify-content:center;max-width:520px;margin:0 auto;width:100%}
  .b{border:none;border-radius:22px;padding:12px 18px;font-weight:700;cursor:pointer;display:flex;gap:7px;align-items:center;font-size:13px}
  .filled{background:#16c7bd;color:#04211f}.ghost{background:rgba(255,255,255,.1);color:#eafaf9}.delb{background:transparent;color:#ff9a8f}.grow{flex:1}
</style></head>
<body>
<div class="wrap">
  <div class="pcard">
    <div class="hd"><span class="mi">image</span> Capture Dashboard (STARMON)</div>
    <div class="snap" onclick="openEd()">
      <img src="data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='600'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230e8b86'/%3E%3Cstop offset='1' stop-color='%230a3b39'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='600' height='600' fill='url(%23g)'/%3E%3Cg stroke='%23fff' stroke-opacity='0.25'%3E%3Cpath d='M0 150H600M0 300H600M0 450H600M150 0V600M300 0V600M450 0V600'/%3E%3C/g%3E%3Ccircle cx='300' cy='300' r='120' fill='%23fff' fill-opacity='0.15'/%3E%3Ctext x='300' y='316' font-family='sans-serif' font-size='44' fill='%23fff' text-anchor='middle'%3EFOTO%3C/text%3E%3C/svg%3E"><div class="tap"><span class="mi">edit</span></div>
      <div class="undo" id="undo" onclick="event.stopPropagation()">
        <div style="position:relative;display:grid;place-items:center"><svg class="ring" viewBox="0 0 34 34"><circle class="t" cx="17" cy="17" r="14"/><circle class="p" id="ring" cx="17" cy="17" r="14"/></svg><span class="cd" id="cd">5</span></div>
        <div class="pill"><span style="font-size:12.5px">Foto dihapus</span><button class="u" onclick="undo()"><span class="mi">undo</span>Urungkan</button></div>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button onclick="openEd()" style="flex:1;border:none;background:var(--sec);color:var(--onsec);border-radius:12px;padding:9px;font-weight:700;cursor:pointer"><span class="mi">tune</span> Edit</button>
      <button style="flex:1;border:none;background:var(--sec);color:var(--onsec);border-radius:12px;padding:9px;font-weight:700;cursor:pointer"><span class="mi">swap_horiz</span> Ganti</button>
      <button onclick="del()" style="border:none;background:transparent;color:var(--bad);border-radius:12px;padding:9px 12px;font-weight:700;cursor:pointer"><span class="mi">delete</span></button>
    </div>
  </div>
  <div class="cap"><b>Opsi C — Immersive Editor.</b> Klik foto → editor layar penuh (frame crop + grid, geser & zoom). Hapus → pill undo + cincin timer di kartu.</div>
</div>
<div class="ed" id="ed">
  <div class="edtop"><span class="ic mi" onclick="closeEd()">arrow_back</span><span class="ttl">Sesuaikan foto</span><span class="grow"></span><span class="ic mi" title="Putar">rotate_right</span></div>
  <div class="estage" id="stage"><img src="data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='600'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%230e8b86'/%3E%3Cstop offset='1' stop-color='%230a3b39'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='600' height='600' fill='url(%23g)'/%3E%3Cg stroke='%23fff' stroke-opacity='0.25'%3E%3Cpath d='M0 150H600M0 300H600M0 450H600M150 0V600M300 0V600M450 0V600'/%3E%3C/g%3E%3Ccircle cx='300' cy='300' r='120' fill='%23fff' fill-opacity='0.15'/%3E%3Ctext x='300' y='316' font-family='sans-serif' font-size='44' fill='%23fff' text-anchor='middle'%3EFOTO%3C/text%3E%3C/svg%3E" id="edImg"><div class="frame"></div></div>
  <div class="ebot">
    <div class="asp"><button class="on">1:1</button><button>4:3</button><button>3:4</button><button>Bebas</button></div>
    <div class="zrow"><span class="mi">zoom_out</span><input type="range" min="60" max="160" value="78" id="z"><span class="mi">zoom_in</span></div>
    <div class="eact"><button class="b delb"><span class="mi">delete</span>Hapus</button><span class="grow"></span><button class="b ghost" onclick="closeEd()">Batal</button><button class="b filled"><span class="mi">check</span>Simpan</button></div>
  </div>
</div>
<script>
  const $=s=>document.querySelector(s);
  const st=$('#stage'),im=$('#edImg');let h=78,dx=0,dy=0,drag=false,px,py;
  function apply(){im.style.height=h+'%';im.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`;}
  $('#z').addEventListener('input',e=>{h=+e.target.value;apply()});
  st.addEventListener('pointerdown',e=>{drag=true;px=e.clientX;py=e.clientY;st.setPointerCapture(e.pointerId);st.style.cursor='grabbing'});
  st.addEventListener('pointermove',e=>{if(!drag)return;dx+=e.clientX-px;dy+=e.clientY-py;px=e.clientX;py=e.clientY;apply()});
  st.addEventListener('pointerup',()=>{drag=false;st.style.cursor='grab'});
  document.querySelectorAll('.asp button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.asp button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  window.openEd=()=>{if($('#undo').classList.contains('on'))return;$('#ed').classList.add('on');apply()};window.closeEd=()=>$('#ed').classList.remove('on');
  let t,left,C=2*Math.PI*14;$('#ring').style.strokeDasharray=C;
  window.del=()=>{$('#undo').classList.add('on');left=5;$('#cd').textContent=left;$('#ring').style.strokeDashoffset=0;requestAnimationFrame(()=>$('#ring').style.strokeDashoffset=C);
    clearInterval(t);t=setInterval(()=>{left--;$('#cd').textContent=left;if(left<=0){clearInterval(t);$('#undo').classList.remove('on')}},1000)};
  window.undo=()=>{clearInterval(t);$('#undo').classList.remove('on')};
</script></body></html>
