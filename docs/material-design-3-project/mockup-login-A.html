<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login A — Aurora Calm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--pri:#04726f;--pri2:#0a4d4a;--ink:#132020;--mut:#5a6a68;--ov:#dbe3e1;--card:#fcfefe;--onp:#fff;--disp:'Sora',system-ui,sans-serif}
  .danger{--pri:#c0392b;--pri2:#7d211a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:15px/1.5 "Segoe UI",Roboto,system-ui;display:grid;place-items:center;overflow:hidden;position:relative;color:var(--ink)}
  .scene{position:fixed;inset:0;z-index:0;transition:background .8s ease;background:linear-gradient(140deg,#0c2726,#0e2a2a 55%,#081f1e)}
  .danger .scene{background:linear-gradient(140deg,#2a0f0c,#361310 55%,#1f0908)}
  .blob{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;transition:background .8s ease;animation:drift 18s ease-in-out infinite alternate}
  .b1{width:360px;height:360px;left:-80px;top:-60px;background:#12b0a8}.b2{width:300px;height:300px;right:-60px;bottom:-40px;background:#0e8b86;animation-delay:-6s}
  .danger .b1{background:#e0574a}.danger .b2{background:#b23a2e}
  @keyframes drift{to{transform:translate(28px,-22px) scale(1.12)}}
  .card{position:relative;z-index:2;width:380px;max-width:calc(100vw - 32px);background:var(--card);border-radius:26px;padding:30px 28px;
    box-shadow:0 30px 80px rgba(0,0,0,.45);transition:transform .5s cubic-bezier(.4,0,.2,1),opacity .5s,filter .5s}
  .card.rise{opacity:0;transform:translateY(18px) scale(.965);filter:blur(6px);animation:rise .6s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none;filter:blur(0)}}
  .card.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
  .card.gone{opacity:0;transform:translateY(-14px) scale(.96);filter:blur(8px);pointer-events:none}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;font-size:23px;background:linear-gradient(135deg,var(--pri),var(--pri2));transition:background .6s}
  .nm{font-family:var(--disp);font-weight:800;font-size:20px}
  .sub{color:var(--mut);font-size:13px;margin:2px 0 18px;height:18px;transition:color .4s}
  .danger .sub{color:var(--pri)}
  .fld{position:relative;margin-bottom:14px}
  .fld input{width:100%;border:1.5px solid var(--ov);background:var(--card);border-radius:13px;padding:17px 40px 7px 14px;font-size:15px;color:var(--ink);outline:none;transition:border-color .18s,box-shadow .18s}
  .fld input:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 16%,transparent)}
  .fld label{position:absolute;left:14px;top:15px;color:var(--mut);pointer-events:none;transition:.16s;font-size:15px}
  .fld input:focus+label,.fld input:not(:placeholder-shown)+label{top:6px;font-size:11px;color:var(--pri);font-weight:600}
  .eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;color:var(--mut)}
  .btn{width:100%;border:none;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:15px;border-radius:14px;font-weight:700;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .6s;box-shadow:0 10px 24px color-mix(in srgb,var(--pri) 30%,transparent)}
  .btn:hover{transform:translateY(-1px)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--pri);opacity:0;transition:opacity .4s}
  .danger .badge{opacity:1}
  /* greeting + dashboard */
  .greet{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:linear-gradient(140deg,#0c2726,#081f1e);opacity:0;pointer-events:none;transition:opacity .6s}
  .danger .greet{background:linear-gradient(140deg,#2a0f0c,#1f0908)}
  .greet.on{opacity:1}
  .greet h1{font-family:var(--disp);font-weight:800;font-size:40px;color:#eafaf9;opacity:0;transform:translateY(14px) scale(.96);filter:blur(6px)}
  .greet.on h1{animation:gin .8s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes gin{to{opacity:1;transform:none;filter:blur(0)}}
  .dash{position:fixed;inset:0;z-index:4;background:#eef1f1;display:grid;place-items:center;color:#3a4a48;opacity:0;pointer-events:none;transition:opacity .6s}
  .dash.on{opacity:1}
  .replay{position:fixed;z-index:9;right:16px;bottom:16px;background:rgba(255,255,255,.14);color:#dfeeed;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:12px}
  .hint{position:fixed;z-index:9;left:16px;bottom:16px;color:#bfe0dd;font-size:12px;opacity:.8}
  .mi{font-family:"Material Symbols Outlined";font-style:normal;line-height:1;vertical-align:-3px}
</style></head>
<body>
  <div class="scene"><div class="blob b1"></div><div class="blob b2"></div></div>
  <div class="dash" id="dash"><div><div style="font-family:var(--disp);font-weight:800;font-size:22px">Dashboard</div><div style="text-align:center;color:#7a8a88">(halaman utama)</div></div></div>
  <div class="greet" id="greet"><h1 id="greetTxt">Hi</h1></div>
  <form class="card rise" id="card" onsubmit="return false">
    <div class="brand"><span class="logo mi" id="logo">bolt</span><span class="nm">BAA Generator</span></div>
    <p class="sub" id="sub">Silakan masuk untuk melanjutkan <span class="badge"><span class="mi">warning</span>Zona Admin</span></p>
    <div class="fld"><input id="u" placeholder=" " oninput="amb()"><label for="u">Username</label></div>
    <div class="fld"><input id="p" type="password" placeholder=" "><label for="p">Password</label><span class="mi eye" onclick="tog()">visibility</span></div>
    <button class="btn" onclick="masuk()"><span class="mi">login</span> Masuk</button>
  </form>
  <div class="hint">Ketik <b>admin</b> → merah · password <b>salah</b> → shake · lainnya → sukses</div>
  <button class="replay" onclick="location.reload()">↻ Ulang</button>
<script>
  const $=s=>document.querySelector(s);
  const isAdmin=()=> $('#u').value.trim().toLowerCase().includes('admin');
  function amb(){document.body.classList.toggle('danger',isAdmin());$('#logo').textContent=isAdmin()?'shield_person':'bolt';}
  function tog(){const p=$('#p');const s=p.type==='password';p.type=s?'text':'password';event.target.textContent=s?'visibility_off':'visibility';}
  function masuk(){const pass=$('#p').value;
    if(pass==='salah'){const c=$('#card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
      $('#p').style.borderColor='#c0392b';setTimeout(()=>$('#p').style.borderColor='',600);return;}
    const nm=$('#u').value.trim()|| (isAdmin()?'Admin':'Operator');
    $('#card').classList.add('gone');
    setTimeout(()=>{$('#greetTxt').textContent='Hi, '+nm+' 👋';$('#greet').classList.add('on');},420);
    setTimeout(()=>$('#greet').classList.remove('on'),2100);
    setTimeout(()=>$('#dash').classList.add('on'),2500);
  }
</script></body></html>
