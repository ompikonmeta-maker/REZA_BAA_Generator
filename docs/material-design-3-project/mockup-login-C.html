<!doctype html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login C — Spotlight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&family=Sora:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root{--pri:#16c7bd;--glow:#0e8b86;--ink:#eafaf9;--mut:#8fa8a6;--disp:'Sora',system-ui}
  .danger{--pri:#ff6a5a;--glow:#c0392b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#06100f;color:var(--ink);font:15px/1.5 "Segoe UI",Roboto,system-ui;display:grid;place-items:center;overflow:hidden;position:relative}
  .spot{position:fixed;left:50%;top:44%;width:760px;height:760px;transform:translate(-50%,-50%);border-radius:50%;z-index:0;
    background:radial-gradient(circle, color-mix(in srgb,var(--glow) 55%, transparent) 0%, transparent 62%);filter:blur(10px);transition:background .8s ease;animation:pulse 6s ease-in-out infinite}
  .danger .spot{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}}
  .wrap{position:relative;z-index:2;width:340px;max-width:calc(100vw - 32px);text-align:center;
    opacity:0;transform:translateY(16px);animation:in .7s cubic-bezier(.2,.8,.2,1) .1s forwards}
  @keyframes in{to{opacity:1;transform:none}}
  .wrap.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97)}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
  .wrap.gone{opacity:0;transform:scale(.94);filter:blur(6px);pointer-events:none;transition:.5s}
  .logo{width:52px;height:52px;border-radius:16px;display:inline-grid;place-items:center;color:#04211f;font-size:26px;margin-bottom:14px;
    background:linear-gradient(135deg,var(--pri),var(--glow));box-shadow:0 0 34px color-mix(in srgb,var(--pri) 55%,transparent);transition:.6s}
  .nm{font-family:var(--disp);font-weight:800;font-size:22px;margin-bottom:2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:24px;height:18px;transition:color .4s}.danger .sub{color:var(--pri)}
  .fld{position:relative;margin-bottom:14px;text-align:left}
  .fld input{width:100%;border:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:13px;padding:16px 40px 16px 14px;font-size:15px;color:#eafaf9;outline:none;transition:.18s}
  .fld input::placeholder{color:#6d8482}
  .fld input:focus{border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 20%,transparent);background:rgba(255,255,255,.09)}
  .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#7d9694}
  .btn{width:100%;margin-top:6px;border:none;background:linear-gradient(135deg,var(--pri),var(--glow));color:#04211f;padding:15px;border-radius:13px;font-weight:800;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,filter .5s;box-shadow:0 8px 26px color-mix(in srgb,var(--pri) 34%,transparent)}
  .btn:hover{transform:translateY(-1px)}
  /* success: spotlight iris grows to fill, greeting */
  .iris{position:fixed;left:50%;top:44%;width:40px;height:40px;transform:translate(-50%,-50%);border-radius:50%;z-index:3;
    background:radial-gradient(circle,var(--glow),#06100f 70%);opacity:0;transition:transform .9s cubic-bezier(.6,0,.2,1),opacity .5s}
  .iris.on{opacity:1;transform:translate(-50%,-50%) scale(60)}
  .greet{position:fixed;inset:0;z-index:4;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .6s}
  .greet.on{opacity:1}
  .greet h1{font-family:var(--disp);font-weight:800;font-size:42px;color:#eafaf9;opacity:0;transform:translateY(12px) scale(.97);filter:blur(6px)}
  .greet.on h1{animation:gin .8s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes gin{to{opacity:1;transform:none;filter:blur(0)}}
  .dash{position:fixed;inset:0;z-index:5;background:#eef1f1;display:grid;place-items:center;color:#3a4a48;opacity:0;pointer-events:none;transition:opacity .6s}
  .dash.on{opacity:1}
  .replay{position:fixed;z-index:9;right:16px;bottom:16px;background:rgba(255,255,255,.1);color:#bfe0dd;border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:8px 14px;cursor:pointer;font-size:12px}
  .hint{position:fixed;z-index:9;left:16px;bottom:14px;color:#5f7876;font-size:12px}
  .mi{font-family:"Material Symbols Outlined";font-style:normal;vertical-align:-3px}
</style></head>
<body>
  <div class="spot" id="spot"></div>
  <div class="iris" id="iris"></div>
  <div class="dash" id="dash"><div><div style="font-family:var(--disp);font-weight:800;font-size:22px">Dashboard</div><div style="text-align:center;color:#7a8a88">(halaman utama)</div></div></div>
  <div class="greet" id="greet"><h1 id="greetTxt">Hi</h1></div>
  <form class="wrap" id="wrap" onsubmit="return false">
    <span class="logo mi" id="logo">bolt</span>
    <div class="nm">BAA Generator</div>
    <p class="sub" id="sub">Masuk untuk melanjutkan</p>
    <div class="fld"><input id="u" placeholder="Username" oninput="amb()"></div>
    <div class="fld"><input id="p" type="password" placeholder="Password"><span class="mi eye" onclick="tog()">visibility</span></div>
    <button class="btn" onclick="masuk()"><span class="mi">login</span> Masuk</button>
  </form>
  <div class="hint">Ketik <b>admin</b> → merah · password <b>salah</b> → shake · lainnya → sukses</div>
  <button class="replay" onclick="location.reload()">↻ Ulang</button>
<script>
  const $=s=>document.querySelector(s);
  const isAdmin=()=>$('#u').value.trim().toLowerCase().includes('admin');
  function amb(){document.body.classList.toggle('danger',isAdmin());$('#logo').textContent=isAdmin()?'shield_person':'bolt';
    $('#sub').textContent=isAdmin()?'Zona admin — hati-hati':'Masuk untuk melanjutkan';}
  function tog(){const p=$('#p');const s=p.type==='password';p.type=s?'text':'password';event.target.textContent=s?'visibility_off':'visibility';}
  function masuk(){const pass=$('#p').value;
    if(pass==='salah'){const w=$('#wrap');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake');return;}
    const nm=$('#u').value.trim()||(isAdmin()?'Admin':'Operator');
    $('#wrap').classList.add('gone');$('#iris').classList.add('on');
    setTimeout(()=>{$('#greetTxt').textContent='Hi, '+nm+' 👋';$('#greet').classList.add('on');},700);
    setTimeout(()=>$('#greet').classList.remove('on'),2300);
    setTimeout(()=>$('#dash').classList.add('on'),2700);
  }
</script></body></html>
