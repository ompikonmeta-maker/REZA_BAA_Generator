<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup — Heatmap ritme (terbaca)</title>
<style>
  :root{--bg:#e9ecec;--pane:#fcfefe;--ink:#141a19;--mut:#586261;--ov:#d6dbda;
    --pri:#04726f;--sec:#cfe6e5;--onsec:#00413f;
    --h0:#e4eeed;--h1:#a9d6d3;--h2:#5fb4b0;--h3:#238b87;--h4:#04726f;--ring:#04726f;}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101413;--pane:#171b1b;--ink:#e6e9e8;--mut:#9fa8a7;--ov:#2d3433;--pri:#57d6d1;--sec:#0e3b39;--onsec:#9ff0ec;--h0:#1c2423;--h1:#245350;--h2:#2f7d78;--h3:#3fa8a3;--h4:#57d6d1;--ring:#7ff0ea;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",Roboto,system-ui,sans-serif}
  .wrap{max-width:680px;margin:0 auto;padding:26px 22px}
  .demo{display:flex;gap:6px;margin-bottom:16px}
  .demo button{border:1px solid var(--ov);background:var(--pane);color:var(--mut);padding:7px 14px;border-radius:18px;cursor:pointer;font-weight:600;font-size:13px}
  .demo button.on{background:var(--sec);color:var(--onsec);border-color:transparent}
  .tile{background:var(--pane);border:1px solid var(--ov);border-radius:20px;padding:18px}
  .th{font-size:14px;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
  .insight{color:var(--mut);font-size:12px;margin:4px 0 16px}
  .insight b{color:var(--ink)}
  /* grid */
  .cal{position:relative}
  .months{display:grid;grid-template-columns:26px repeat(8,1fr);gap:5px;margin:0 0 5px 0;font-size:10.5px;color:var(--mut);font-weight:600}
  .months span{grid-row:1;text-align:left}
  .body{display:grid;grid-template-columns:26px repeat(8,1fr);gap:5px}
  .days{display:grid;grid-template-rows:repeat(7,1fr);gap:5px;font-size:9.5px;color:var(--mut)}
  .days span{display:flex;align-items:center;height:100%}
  .col{display:grid;grid-template-rows:repeat(7,1fr);gap:5px}
  .c{aspect-ratio:1;border-radius:5px;background:var(--h0);cursor:pointer;transition:transform .1s;position:relative}
  .c:hover{transform:scale(1.22);z-index:2}
  .c.l1{background:var(--h1)}.c.l2{background:var(--h2)}.c.l3{background:var(--h3)}.c.l4{background:var(--h4)}
  .c.empty{background:transparent;cursor:default}
  .c.today{box-shadow:0 0 0 2px var(--ring)}
  /* legend numbered */
  .legend{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin-top:14px;font-size:11px;color:var(--mut)}
  .legend .items{display:flex;gap:10px}
  .legend .k{display:flex;align-items:center;gap:5px}
  .legend i{width:13px;height:13px;border-radius:4px;display:inline-block}
  /* empty overlay */
  .cal.blank .c:not(.empty){background:var(--h0)}
  .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;
    background:color-mix(in srgb,var(--pane) 72%,transparent);border-radius:10px;color:var(--mut);font-size:13px;font-weight:600;flex-direction:column;gap:6px}
  .cal.blank .overlay{display:flex}
  .overlay .mi{font-size:26px;opacity:.5}
  /* tooltip */
  .tip{position:fixed;z-index:50;background:var(--ink);color:var(--pane);font-size:11.5px;padding:6px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;transform:translate(-50%,-140%);font-weight:500}
  .mi{font-family:"Material Symbols Outlined","Segoe UI Symbol";font-style:normal}
</style>
</head>
<body>
<div class="wrap">
  <div class="demo"><button class="on" id="bFull">Data ramai</button><button id="bEmpty">Data kosong</button></div>
  <div class="tile">
    <div class="th"><span class="mi">calendar_month</span> Ritme aktivitas · 8 minggu</div>
    <div class="insight" id="insight"></div>
    <div class="cal" id="cal">
      <div class="months" id="months"></div>
      <div class="body">
        <div class="days"><span>Sen</span><span></span><span>Rab</span><span></span><span>Jum</span><span></span><span>Min</span></div>
        <div id="cols" style="display:contents"></div>
      </div>
      <div class="overlay"><span class="mi">event_busy</span>Belum ada aktivitas 8 minggu terakhir</div>
    </div>
    <div class="legend"><span>Klik sel → buka Log Lokasi tanggal itu</span><span class="items">
      <span class="k"><i style="background:var(--h0)"></i>0</span>
      <span class="k"><i style="background:var(--h1)"></i>1–2</span>
      <span class="k"><i style="background:var(--h2)"></i>3–5</span>
      <span class="k"><i style="background:var(--h4)"></i>6+</span></span>
    </div>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
  const $=s=>document.querySelector(s);
  const DAYS=['Min','Sen','Sel','Rab','Kam','Jum','Sab'],MO=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
  const today=new Date();today.setHours(0,0,0,0);
  const wd=(today.getDay()+6)%7;                 // Senin=0..Minggu=6
  const startMon=new Date(today);startMon.setDate(today.getDate()-wd-7*7); // Senin 8 minggu lalu
  function lvl(v){return v<=0?0:v<=2?1:v<=5?2:v<=8?3:4;}
  let CELLS=[];
  function build(full){
    CELLS=[];const cols=$('#cols');cols.innerHTML='';const months=$('#months');months.innerHTML='<span></span>';
    let prevMonth=-1;
    for(let w=0;w<8;w++){
      const col=document.createElement('div');col.className='col';
      const first=new Date(startMon);first.setDate(startMon.getDate()+w*7);
      months.innerHTML+=`<span>${first.getMonth()!==prevMonth?MO[first.getMonth()]:''}</span>`;prevMonth=first.getMonth();
      for(let r=0;r<7;r++){
        const dt=new Date(startMon);dt.setDate(startMon.getDate()+w*7+r);
        const cell=document.createElement('div');
        if(dt>today){cell.className='c empty';}
        else{
          const v=full?Math.max(0,Math.round((Math.sin(w*1.7+r*0.9)+ (Math.random()*1.4-0.2))*3)):0;
          cell.className='c l'+lvl(v);cell.dataset.v=v;
          cell.dataset.d=`${DAYS[dt.getDay()]}, ${dt.getDate()} ${MO[dt.getMonth()]}`;
          if(+dt===+today)cell.classList.add('today');
          CELLS.push(v);
        }
        col.appendChild(cell);
      }
      cols.appendChild(col);
    }
    // insight
    const active=CELLS.filter(v=>v>0).length,totalDays=CELLS.length,sum=CELLS.reduce((a,b)=>a+b,0);
    // hari tersibuk
    const byDay=[0,0,0,0,0,0,0],cnt=[0,0,0,0,0,0,0];let idx=0;
    for(let w=0;w<8;w++)for(let r=0;r<7;r++){const dt=new Date(startMon);dt.setDate(startMon.getDate()+w*7+r);if(dt<=today){byDay[r]+=CELLS[idx]||0;idx++;}}
    const busy=byDay.indexOf(Math.max(...byDay));const dayName=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'][busy];
    $('#cal').classList.toggle('blank',!full || sum===0);
    $('#insight').innerHTML=full&&sum>0
      ? `<b>${active}</b> dari ${totalDays} hari aktif · total <b>${sum}</b> aktivitas · tersibuk <b>${dayName}</b>`
      : `Ringkasan 56 hari terakhir`;
  }
  const tip=$('#tip');
  $('#cols').addEventListener('mouseover',e=>{const c=e.target.closest('.c');if(c&&c.dataset.d){const r=c.getBoundingClientRect();
    tip.textContent=`${c.dataset.d} · ${c.dataset.v} aktivitas`;tip.style.left=r.left+r.width/2+'px';tip.style.top=r.top+'px';tip.style.opacity=1;}});
  $('#cols').addEventListener('mouseout',()=>tip.style.opacity=0);
  $('#bFull').onclick=()=>{$('#bFull').classList.add('on');$('#bEmpty').classList.remove('on');build(true);};
  $('#bEmpty').onclick=()=>{$('#bEmpty').classList.add('on');$('#bFull').classList.remove('on');build(false);};
  build(true);
</script>
</body>
</html>
