name: Build Windows EXE

# Build exe portabel. Unduh hasilnya di tab Actions -> run terkait -> Artifacts.
on:
  workflow_dispatch:        # tombol "Run workflow" manual
  push:
    branches:
      - "claude/**"
      - main
    paths:
      - "app/**"
      - "run.py"
      - "requirements.txt"
      - "rezabaa.spec"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build one-file executable
        run: pyinstaller rezabaa.spec --noconfirm --clean

      - name: Stage release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/REZA_BAA_Generator.exe release/
          Copy-Item docs/Template_BAA.xlsx release/ -ErrorAction SilentlyContinue
          @"
          REZA BAA Generator — cara pakai
          ================================
          1. Jalankan REZA_BAA_Generator.exe (klik dua kali). Tanpa install, tanpa admin.
          2. Buka browser: http://localhost:8000  (login awal: admin / admin, wajib ganti).
          3. User lain di jaringan yang sama: buka http://<IP-komputer-ini>:8000
          4. Data tersimpan di folder 'data' yang muncul di samping .exe.

          OCR (opsional): letakkan folder 'tesseract' (berisi tesseract.exe) di samping
          .exe, atau set variabel REZA_BAA_TESSERACT ke path tesseract.exe.
          "@ | Out-File -FilePath release/CARA_PAKAI.txt -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: REZA_BAA_Generator-windows
          path: release/
          retention-days: 30
